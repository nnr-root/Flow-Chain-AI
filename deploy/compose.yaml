# The studio on one server: proxy (HTTPS + login) → web → redis ← worker.
# Settings come from the env file `npm run server:setup` writes on the server; see deploy/server.env.example.
name: flowchain

# container logs are kept small: a server's disk is for runs
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-data: &data
  RUNS_DIR: /data/runs
  BRAND_KITS_DIR: /data/brand-kits
  STUDIO_UPLOADS_DIR: /data/uploads/music
  REDIS_URL: redis://redis:6379

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    environment:
      STUDIO_SITE: ${STUDIO_SITE:-${STUDIO_HOST:?set STUDIO_HOST to the studio's public host name}}
      # the proxy's own login, for a studio without accounts (with them, CADDYFILE is Caddyfile.accounts and these are unused)
      STUDIO_USER: ${STUDIO_USER:-}
      STUDIO_PASSWORD_HASH: ${STUDIO_PASSWORD_HASH:-}
    volumes:
      # which of the two is written by server:setup; never guessed, so a studio cannot come up without a login by accident
      - ./${CADDYFILE:?set CADDYFILE to Caddyfile (the proxy asks for the login) or Caddyfile.accounts (the studio does)}:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-./data}/caddy:/data
    depends_on:
      web:
        condition: service_healthy
    networks: [front]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    init: true
    environment:
      <<: *data
      STUDIO_HOST: ${STUDIO_HOST:?set STUDIO_HOST to the studio's public host name}
    # with accounts: where they live and the bucket's keys; never a provider key, never the key that settles credit
    env_file:
      - ${WEB_ENV_FILE:?set WEB_ENV_FILE to the web app's settings file (it may be empty)}
    volumes:
      # the web app reads runs and writes only what is uploaded in the studio
      - ${DATA_DIR:-./data}/runs:/data/runs:ro
      - ${DATA_DIR:-./data}/brand-kits:/data/brand-kits
      - ${DATA_DIR:-./data}/uploads:/data/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks: [front, back]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3131/api/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    logging: *logging
    # an init process forwards the stop signal and reaps the CLI's children
    init: true
    # a deploy lets running jobs finish: the worker waits up to WORKER_DRAIN_MS (30 min), which must stay below this
    stop_grace_period: 31m
    environment:
      <<: *data
      WORKER_DRAIN_MS: "1800000"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    # the provider keys: given to this service only
    env_file:
      # outside the code folder, so it can never be copied into an image
      - ${WORKER_ENV_FILE:?set WORKER_ENV_FILE to the file with the provider keys}
    volumes:
      - ${DATA_DIR:-./data}/runs:/data/runs
      - ${DATA_DIR:-./data}/brand-kits:/data/brand-kits:ro
      - ${DATA_DIR:-./data}/uploads:/data/uploads:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [back]

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging
    # the append-only file, written before a command is answered, keeps waiting jobs across a restart or a crash
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [back]

# the proxy reaches the web app and nothing else; Redis is known only to the web app and the worker
networks:
  front:
  back:
