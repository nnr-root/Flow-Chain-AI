# Builds the RunPod worker image (2.4 spec §4.2) and pushes it to GitHub's container registry.
name: worker-image
on:
  push:
    branches: [main]
    paths: ["workers/**", "worker-voice/**", "worker-picture/**", "worker-upscale/**", "worker-foley/**", "worker-ltx/**", ".github/workflows/worker-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the deploy pulls an immutable tag derived from the content of workers/ (npm run runpod:deploy)
      - id: tree
        run: echo "tag=w-$(git rev-parse HEAD:workers | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # the CUDA/PyTorch base image needs more disk than a hosted runner has free by default
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowchain-worker" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: workers
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:${{ steps.tree.outputs.tag }}

  # The voice worker (phase 5 spec §6.1): its own image, tagged by the content of worker-voice/.
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: echo "tag=v-$(git rev-parse HEAD:worker-voice | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowchain-voice" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: worker-voice
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ steps.tree.outputs.tag }}

  # The picture worker (phase 5 spec §6.2): its own image, tagged by the content of worker-picture/.
  picture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: echo "tag=p-$(git rev-parse HEAD:worker-picture | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowchain-picture" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: worker-picture
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ steps.tree.outputs.tag }}

  # The upscaling worker (phase 8 spec §8): its own image, with its model inside, tagged by the content of worker-upscale/.
  upscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: echo "tag=u-$(git rev-parse HEAD:worker-upscale | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowchain-upscale" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: worker-upscale
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ steps.tree.outputs.tag }}

  # The Foley worker (phase 14 spec §4): its own image, with its models inside, tagged by the content of worker-foley/.
  foley:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: echo "tag=f-$(git rev-parse HEAD:worker-foley | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # the image's layers, the build cache and the push need about 25-30 GB at their peak: free everything the action can
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowchain-foley" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: worker-foley
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ steps.tree.outputs.tag }}

  # The LTX worker (phase 15): its own image (about 72 GB), tagged by the content of worker-ltx/. The Hugging Face token
  # for its gated weights is a BuildKit secret (`hf_token`), never a build argument: a build argument stays in the image's history.
  ltx:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: echo "tag=l-$(git rev-parse HEAD:worker-ltx | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # the image is about 72 GB, and a hosted runner has about 14 GB free at the start: remove what is preinstalled and unused
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flowchain-ltx" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: worker-ltx
          platforms: linux/amd64
          push: true
          secrets: |
            hf_token=${{ secrets.HF_TOKEN_LTX }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ steps.tree.outputs.tag }}
