# The clip model's folders on the RunPod network volume (mounted at /runpod-volume). The text encoder and the VAE
# are not here: they are in the image, in ComfyUI's own models/text_encoders and models/vae.
runpod_volume:
  base_path: /runpod-volume
  loras: models/loras/
  diffusion_models: models/diffusion_models/
  unet: models/diffusion_models/
